<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1e1c" />
    <script>
      // Apply a saved light/dark choice before first paint to avoid a flash
      try {
        var saved = localStorage.getItem('site_theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <meta name="description" content="Apps, kids' games and interview prep notes by Ajay Rojha." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />

  </head>

  </body>
